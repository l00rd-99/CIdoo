<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidoo — Корзина</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="main">
  <div class="cart-page">
    <h1 class="cart-page-title" id="cart-title"></h1>
    <div id="cart-content"></div>
  </div>
</main>

<script type="module">
  import { Cart } from './js/models.js';
  import { renderHeader, showToast, updateCartBadge, escapeHtml, showOrderModal } from './js/ui.js';
  import { i18n } from './js/i18n.js';

  renderHeader('cart');
  document.getElementById('cart-title').textContent = i18n.t('cart_title');

  const content = document.getElementById('cart-content');
  const cart = new Cart();

  function render() {
    if (cart.items.length === 0) {
      content.innerHTML = `
        <div class="cart-empty">
          <svg class="cart-empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <h3>${i18n.t('cart_empty_title')}</h3>
          <p>${i18n.t('cart_empty_hint')}</p>
          <a href="index.html" class="btn btn-primary">${i18n.t('btn_to_catalog')}</a>
        </div>
      `;
      return;
    }

    const itemsHTML = cart.items.map(item => `
      <div class="cart-item" data-id="${item.product.id}">
        <div class="cart-item-img">
          <img src="${escapeHtml(item.product.image)}" alt="${escapeHtml(item.product.title)}">
        </div>
        <div class="cart-item-info">
          <a href="product.html?id=${item.product.id}" style="text-decoration:none">
            <p class="cart-item-name">${escapeHtml(item.product.title)}</p>
          </a>
          <p class="cart-item-price">$${(item.product.price * item.quantity).toFixed(2)}</p>
        </div>
        <div class="cart-item-qty">
          <button class="qty-btn" data-action="dec" data-id="${item.product.id}">−</button>
          <span class="qty-value">${item.quantity}</span>
          <button class="qty-btn" data-action="inc" data-id="${item.product.id}">+</button>
        </div>
        <button class="cart-item-remove" data-id="${item.product.id}" aria-label="Remove">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M10 11v6M14 11v6M9 6V4h6v2"/>
          </svg>
        </button>
      </div>
    `).join('');

    const shipping = cart.total > 50 ? 0 : 4.99;
    const freeShippingHtml = `<span style="color:var(--success)">${i18n.t('summary_free')}</span>`;
    const itemsLabel = i18n.t('summary_items_unit')
      ? `${i18n.t('summary_items')} (${cart.count} ${i18n.t('summary_items_unit')})`
      : `${i18n.t('summary_items')} (${cart.count})`;

    content.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items-list">${itemsHTML}</div>
        <div class="cart-summary">
          <h3>${i18n.t('summary_title')}</h3>
          <div class="summary-row">
            <span>${itemsLabel}</span>
            <span>${cart.formattedTotal}</span>
          </div>
          <div class="summary-row">
            <span>${i18n.t('summary_delivery')}</span>
            <span>${shipping === 0 ? freeShippingHtml : `$${shipping.toFixed(2)}`}</span>
          </div>
          <div class="summary-row total">
            <span>${i18n.t('summary_total')}</span>
            <span>$${(cart.total + shipping).toFixed(2)}</span>
          </div>
          ${cart.total <= 50 ? `<p style="font-size:12px;color:var(--text-tertiary);margin-top:8px">${i18n.t('free_delivery_hint')}</p>` : ''}
          <button class="btn btn-primary" id="checkout-btn">${i18n.t('btn_checkout')}</button>
          <a href="index.html" class="btn btn-secondary" style="margin-top:10px;display:flex;justify-content:center">${i18n.t('btn_back_catalog')}</a>
        </div>
      </div>
    `;

    content.querySelectorAll('.qty-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.id);
        const item = cart.items.find(i => i.product.id === id);
        if (!item) return;
        const delta = btn.dataset.action === 'inc' ? 1 : -1;
        cart.updateQuantity(id, item.quantity + delta);
        updateCartBadge();
        render();
      });
    });

    content.querySelectorAll('.cart-item-remove').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = Number(btn.dataset.id);
        cart.remove(id);
        updateCartBadge();
        showToast(i18n.t('removed_toast'), 'info');
        render();
      });
    });

    document.getElementById('checkout-btn').addEventListener('click', () => {
      showOrderModal(({ name, address, phone }) => {
        cart.clear();
        updateCartBadge();
        showToast(i18n.t('order_success'), 'success', 5000);
        render();
      });
    });
  }

  render();
</script>
</body>
</html>
