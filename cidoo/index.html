<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidoo — Каталог</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="main">
  <section class="hero">
    <p class="hero-eyebrow" id="hero-eyebrow"></p>
    <h1 class="hero-title" id="hero-title"></h1>
    <p class="hero-subtitle" id="hero-subtitle"></p>
  </section>

  <!-- Brand pills -->
  <div class="brand-bar" id="brand-bar"></div>

  <section class="catalog-section">
    <div class="section-header">
      <h2 class="section-title" id="section-title"></h2>
    </div>

    <div class="filter-bar">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input class="search-input" id="search-input" placeholder="">
      </div>
      <select class="filter-select" id="sort-filter"></select>
    </div>

    <div class="product-grid" id="product-grid"></div>
  </section>
</main>

<script type="module">
  import { api } from './js/api.js';
  import { Cart } from './js/models.js';
  import { renderHeader, showToast, renderSkeletons, updateCartBadge, escapeHtml } from './js/ui.js';
  import { i18n } from './js/i18n.js';

  document.getElementById('hero-eyebrow').textContent = i18n.t('hero_eyebrow');
  document.getElementById('hero-title').textContent = i18n.t('hero_title');
  document.getElementById('hero-subtitle').textContent = i18n.t('hero_subtitle');
  document.getElementById('section-title').textContent = i18n.t('catalog_title');
  document.getElementById('search-input').placeholder = i18n.t('search_placeholder');

  const sortFilter = document.getElementById('sort-filter');
  [
    ['default', i18n.t('sort_default')],
    ['price-asc', i18n.t('sort_price_asc')],
    ['price-desc', i18n.t('sort_price_desc')],
    ['name-asc', i18n.t('sort_name_asc')],
    ['name-desc', i18n.t('sort_name_desc')],
  ].forEach(([val, label]) => {
    const opt = document.createElement('option');
    opt.value = val;
    opt.textContent = label;
    sortFilter.appendChild(opt);
  });

  renderHeader('home');

  const grid = document.getElementById('product-grid');
  const searchInput = document.getElementById('search-input');
  const brandBar = document.getElementById('brand-bar');

  let allProducts = [];
  let activeBrand = '';
  const cart = new Cart();

  renderSkeletons(grid, 8);

  async function init() {
    try {
      allProducts = await api.getProducts();
      const brands = api.getBrands();

      brandBar.innerHTML = '';

      const allPill = document.createElement('button');
      allPill.className = 'brand-pill active';
      allPill.dataset.brand = '';
      allPill.textContent = i18n.t('brand_all');
      brandBar.appendChild(allPill);

      brands.forEach(brand => {
        const pill = document.createElement('button');
        pill.className = 'brand-pill';
        pill.dataset.brand = brand;
        pill.textContent = brand;
        brandBar.appendChild(pill);
      });

      brandBar.addEventListener('click', e => {
        const pill = e.target.closest('.brand-pill');
        if (!pill) return;
        brandBar.querySelectorAll('.brand-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activeBrand = pill.dataset.brand;
        renderProducts();
      });

      renderProducts();
    } catch (e) {
      grid.innerHTML = `<p style="color:var(--text-secondary);padding:40px 0">${i18n.t('loading_error')}</p>`;
    }
  }

  function renderProducts() {
    let products = [...allProducts];

    if (activeBrand) products = products.filter(p => p.category === activeBrand);

    const q = searchInput.value.toLowerCase().trim();
    if (q) products = products.filter(p =>
      p.title.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
    );

    // Sort
    const sort = sortFilter.value;
    if (sort === 'price-asc') products.sort((a, b) => a.price - b.price);
    else if (sort === 'price-desc') products.sort((a, b) => b.price - a.price);
    else if (sort === 'name-asc') products.sort((a, b) => a.title.localeCompare(b.title));
    else if (sort === 'name-desc') products.sort((a, b) => b.title.localeCompare(a.title));

    if (products.length === 0) {
      grid.innerHTML = `
        <div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text-secondary)">
          <svg style="width:48px;height:48px;margin-bottom:16px;color:var(--text-tertiary)" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <p style="font-size:18px;font-weight:600;color:var(--text-primary);margin-bottom:8px">${i18n.t('nothing_found')}</p>
          <p>${i18n.t('nothing_found_hint')}</p>
        </div>`;
      return;
    }

    grid.innerHTML = products.map(p => `
      <div class="product-card" data-id="${p.id}">
        <a href="product.html?id=${p.id}" style="text-decoration:none;display:contents">
          <div class="product-img-wrap">
            <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.title)}" loading="lazy">
          </div>
          <div class="product-info">
            <span class="product-category">${escapeHtml(p.category)}</span>
            <p class="product-name">${escapeHtml(p.title)}</p>
            <p class="product-price">${p.formattedPrice}</p>
          </div>
        </a>
        <div class="product-actions">
          <button class="btn btn-primary add-to-details" data-id="${p.id}">${i18n.t('btn_details')}</button>
          <button class="btn-cart-quick add-to-cart-quick" data-id="${p.id}" title="${i18n.t('btn_add_cart')}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
              <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
            </svg>
          </button>
        </div>
      </div>
    `).join('');

    grid.querySelectorAll('.add-to-details').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        window.location.href = `product.html?id=${btn.dataset.id}`;
      });
    });

    grid.querySelectorAll('.add-to-cart-quick').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = Number(btn.dataset.id);
        const product = allProducts.find(p => p.id === id);
        if (!product) return;
        cart.add(product);
        updateCartBadge();
        showToast(`${product.title.slice(0, 36)}… ${i18n.t('added_toast')}`, 'success');

        btn.style.background = 'var(--success)';
        btn.style.borderColor = 'var(--success)';
        btn.style.color = 'white';
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>`;
        setTimeout(() => {
          btn.style.background = '';
          btn.style.borderColor = '';
          btn.style.color = '';
          btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>`;
        }, 1800);
      });
    });
  }

  searchInput.addEventListener('input', renderProducts);
  sortFilter.addEventListener('change', renderProducts);

  init();
</script>
</body>
</html>
