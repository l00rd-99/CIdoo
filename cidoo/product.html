<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidoo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="main">
  <div class="product-page" id="product-page">
  </div>
</main>

<script type="module">
  import { api } from './js/api.js';
  import { Cart, Product } from './js/models.js';
  import { renderHeader, showToast, updateCartBadge, escapeHtml, getProductIdFromUrl } from './js/ui.js';
  import { i18n } from './js/i18n.js';

  renderHeader('');

  const page = document.getElementById('product-page');
  const id = getProductIdFromUrl();

  if (!id) {
    window.location.href = 'index.html';
  }

  page.innerHTML = `
    <a href="index.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      ${i18n.t('back_catalog')}
    </a>
    <div class="product-detail">
      <div class="skeleton" style="aspect-ratio:1;border-radius:var(--radius-xl)"></div>
      <div style="display:flex;flex-direction:column;gap:16px;padding-top:20px">
        <div class="skeleton skeleton-line" style="width:30%;height:12px"></div>
        <div class="skeleton skeleton-line" style="width:80%;height:32px"></div>
        <div class="skeleton skeleton-line" style="width:60%;height:32px"></div>
        <div class="skeleton skeleton-line" style="width:40%;height:40px;margin-top:8px"></div>
        <div class="skeleton skeleton-line" style="height:1px;margin:8px 0"></div>
        <div class="skeleton skeleton-line" style="width:100%;height:14px"></div>
        <div class="skeleton skeleton-line" style="width:90%;height:14px"></div>
        <div class="skeleton skeleton-line" style="width:95%;height:14px"></div>
        <div class="skeleton skeleton-line" style="height:52px;border-radius:var(--radius-lg);margin-top:16px"></div>
        <div class="skeleton skeleton-line" style="height:52px;border-radius:var(--radius-lg)"></div>
      </div>
    </div>
  `;

  async function init() {
    try {
      const product = await api.getProduct(id);
      document.title = `Cidoo — ${product.title}`;

      page.innerHTML = `
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          ${i18n.t('back_catalog')}
        </a>
        <div class="product-detail">
          <div class="product-detail-img-wrap">
            <img src="${escapeHtml(product.image)}" alt="${escapeHtml(product.title)}">
          </div>
          <div class="product-detail-info">
            <span class="product-detail-category">${escapeHtml(product.category)}</span>
            <h1 class="product-detail-title">${escapeHtml(product.title)}</h1>
            <div class="product-detail-price">${product.formattedPrice}</div>
            <p class="product-detail-desc">${escapeHtml(product.description)}</p>
            <div class="product-detail-actions">
              <button class="btn btn-primary" id="add-to-cart">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
                  <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
                </svg>
                ${i18n.t('btn_add_cart')}
              </button>
              <a href="cart.html" class="btn btn-secondary" id="go-to-cart">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
                ${i18n.t('btn_go_cart')}
              </a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('add-to-cart').addEventListener('click', () => {
        const cart = new Cart();
        cart.add(product);
        updateCartBadge();
        showToast(`${product.title.slice(0, 40)}… ${i18n.t('added_toast')}`, 'success');

        const btn = document.getElementById('add-to-cart');
        btn.textContent = i18n.t('btn_added');
        btn.style.background = 'var(--success)';
        setTimeout(() => {
          btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg> ${i18n.t('btn_add_cart')}`;
          btn.style.background = '';
        }, 2000);
      });

    } catch (e) {
      page.innerHTML = `
        <a href="index.html" class="back-link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          ${i18n.t('back_catalog')}
        </a>
        <div style="text-align:center;padding:80px 0;color:var(--text-secondary)">
          <p style="font-size:18px;font-weight:600;color:var(--text-primary);margin-bottom:8px">${i18n.t('product_not_found')}</p>
          <p>${i18n.t('product_not_found_hint')}</p>
        </div>
      `;
    }
  }

  init();
</script>
</body>
</html>
