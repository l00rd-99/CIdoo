<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cidoo — Sign In</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">Cidoo<span>.</span></div>

    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login" id="tab-login"></div>
      <div class="auth-tab" data-tab="register" id="tab-register"></div>
    </div>

    <!-- LOGIN -->
    <div class="auth-form-panel active" id="panel-login">
      <div class="form-group">
        <label class="form-label" id="login-email-label"></label>
        <input class="form-input" id="login-email" type="email" autocomplete="email">
        <span class="form-error" id="login-email-err"></span>
      </div>
      <div class="form-group">
        <label class="form-label" id="login-password-label"></label>
        <input class="form-input" id="login-password" type="password" autocomplete="current-password">
        <span class="form-error" id="login-password-err"></span>
      </div>
      <span class="form-error" id="login-global-err"></span>
      <button class="btn btn-primary form-submit" id="login-btn"></button>
    </div>

    <!-- REGISTER -->
    <div class="auth-form-panel" id="panel-register">
      <div class="form-group">
        <label class="form-label" id="reg-name-label"></label>
        <input class="form-input" id="reg-name" type="text" autocomplete="name">
      </div>
      <div class="form-group">
        <label class="form-label" id="reg-email-label"></label>
        <input class="form-input" id="reg-email" type="email" autocomplete="email">
        <span class="form-error" id="reg-email-err"></span>
      </div>
      <div class="form-group">
        <label class="form-label" id="reg-password-label"></label>
        <input class="form-input" id="reg-password" type="password" autocomplete="new-password">
        <span class="form-error" id="reg-password-err"></span>
      </div>
      <span class="form-error" id="reg-global-err"></span>
      <button class="btn btn-primary form-submit" id="register-btn"></button>
    </div>
  </div>

  <div class="auth-lang-switcher">
    <button class="ctrl-btn" id="auth-theme-btn"></button>
    <button class="ctrl-btn lang-toggle" id="auth-lang-btn"></button>
  </div>
</main>

<script type="module">
  import { auth } from './js/auth.js';
  import { showToast } from './js/ui.js';
  import { i18n } from './js/i18n.js';
  import { theme, themeToggleHTML } from './js/theme.js';

  document.getElementById('tab-login').textContent = i18n.t('auth_login');
  document.getElementById('tab-register').textContent = i18n.t('auth_register');

  document.getElementById('login-email-label').textContent = i18n.t('auth_email_label');
  document.getElementById('login-email').placeholder = i18n.t('auth_email_ph');
  document.getElementById('login-password-label').textContent = i18n.t('auth_password_label');
  document.getElementById('login-password').placeholder = i18n.t('auth_password_ph_login');
  document.getElementById('login-btn').textContent = i18n.t('auth_btn_login');

  document.getElementById('reg-name-label').textContent = i18n.t('auth_name_label');
  document.getElementById('reg-name').placeholder = i18n.t('auth_name_ph');
  document.getElementById('reg-email-label').textContent = i18n.t('auth_email_label');
  document.getElementById('reg-email').placeholder = i18n.t('auth_email_ph');
  document.getElementById('reg-password-label').textContent = i18n.t('auth_password_label');
  document.getElementById('reg-password').placeholder = i18n.t('auth_password_ph_reg');
  document.getElementById('register-btn').textContent = i18n.t('auth_btn_register');

  const themeBtn = document.getElementById('auth-theme-btn');
  themeBtn.innerHTML = themeToggleHTML(i18n.t('theme_dark'), i18n.t('theme_light'), theme.isDark());
  themeBtn.addEventListener('click', () => theme.toggle());

  const langBtn = document.getElementById('auth-lang-btn');
  langBtn.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px">
      <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    <span class="ctrl-label">${i18n.t('lang_label')}</span>
  `;
  langBtn.addEventListener('click', () => i18n.toggle());

  if (auth.isLoggedIn()) {
    window.location.href = 'index.html';
  }

  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-form-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById(`panel-${tab.dataset.tab}`).classList.add('active');
      clearErrors();
    });
  });

  function clearErrors() {
    document.querySelectorAll('.form-error').forEach(el => el.textContent = '');
  }

  function validateEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  document.getElementById('login-btn').addEventListener('click', () => {
    clearErrors();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    let valid = true;

    if (!email) {
      document.getElementById('login-email-err').textContent = i18n.t('auth_err_email_empty');
      valid = false;
    } else if (!validateEmail(email)) {
      document.getElementById('login-email-err').textContent = i18n.t('auth_err_email_invalid');
      valid = false;
    }

    if (!password) {
      document.getElementById('login-password-err').textContent = i18n.t('auth_err_password_empty');
      valid = false;
    }

    if (!valid) return;

    try {
      const user = auth.login(email, password);
      showToast(`${i18n.t('auth_welcome')}, ${user.name}!`, 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    } catch (e) {
      document.getElementById('login-global-err').textContent = e.message;
    }
  });

  document.getElementById('register-btn').addEventListener('click', () => {
    clearErrors();
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    let valid = true;

    if (!email) {
      document.getElementById('reg-email-err').textContent = i18n.t('auth_err_email_empty');
      valid = false;
    } else if (!validateEmail(email)) {
      document.getElementById('reg-email-err').textContent = i18n.t('auth_err_email_invalid');
      valid = false;
    }

    if (!password) {
      document.getElementById('reg-password-err').textContent = i18n.t('auth_err_password_empty');
      valid = false;
    } else if (password.length < 6) {
      document.getElementById('reg-password-err').textContent = i18n.t('auth_err_password_short');
      valid = false;
    }

    if (!valid) return;

    try {
      const user = auth.register(email, password, name);
      showToast(`${i18n.t('auth_created')}, ${user.name}!`, 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 800);
    } catch (e) {
      document.getElementById('reg-global-err').textContent = e.message;
    }
  });

  document.querySelectorAll('.form-input').forEach(input => {
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const panel = input.closest('.auth-form-panel');
        panel.querySelector('button').click();
      }
    });
  });
</script>
</body>
</html>
